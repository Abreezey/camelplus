# Hard-deny secret data flowing to non-corporate destinations (arch.md §6.5 example).
# Requires a DestinationClassifier that maps corporate destinations to the "corp" domain.
id: deny-secret-egress
when:
  effect.type: EGRESS
  any_data.confidentiality_at_least: secret
  destination.domain_not_in: [corp]
then: DENY
